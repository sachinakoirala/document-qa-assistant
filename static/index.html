<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document Q&amp;A Assistant</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #ffffff; --ink: #0f172a; --muted: #64748b;
      --user: #2563eb; --bot: #f1f5f9; --accent: #2563eb; --line: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .app {
      width: 100%; max-width: 720px; height: min(88vh, 820px);
      background: var(--panel); border-radius: 16px; overflow: hidden;
      display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    header {
      padding: 18px 22px; border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 17px; color: var(--ink); }
    header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    #messages {
      flex: 1; overflow-y: auto; padding: 22px; display: flex;
      flex-direction: column; gap: 14px; background: #fbfcfe;
    }
    .msg { max-width: 82%; padding: 11px 14px; border-radius: 14px; line-height: 1.5;
           font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
    .bot  { align-self: flex-start; background: var(--bot); color: var(--ink); border-bottom-left-radius: 4px; }
    .sources { align-self: flex-start; font-size: 12px; color: var(--muted); margin-top: -6px; }
    .sources span {
      display: inline-block; background: #eef2ff; color: var(--accent);
      border: 1px solid #dbe3ff; padding: 2px 8px; border-radius: 999px; margin-right: 6px;
    }
    .empty { color: var(--muted); font-size: 14px; text-align: center; margin: auto; max-width: 60%; }
    form { display: flex; gap: 10px; padding: 16px; border-top: 1px solid var(--line); background: #fff; }
    input {
      flex: 1; padding: 12px 14px; font-size: 14.5px; border: 1px solid var(--line);
      border-radius: 10px; outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    button {
      padding: 0 20px; font-size: 14.5px; font-weight: 600; color: #fff;
      background: var(--accent); border: none; border-radius: 10px; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: default; }
    .dots::after { content: "…"; animation: blink 1.2s steps(4) infinite; }
    @keyframes blink { 0%{opacity:.2} 50%{opacity:1} 100%{opacity:.2} }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>📄 Document Q&amp;A Assistant</h1>
      <p>Answers are grounded in your indexed documents, with sources cited.</p>
    </header>
    <div id="messages">
      <div class="empty" id="empty">Ask a question about your documents to get started.</div>
    </div>
    <form id="form">
      <input id="input" type="text" placeholder="e.g. How many vacation days do I get?" autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const empty = document.getElementById("empty");

    function addMessage(text, cls) {
      const el = document.createElement("div");
      el.className = "msg " + cls;
      el.textContent = text;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }

    function addSources(sources) {
      if (!sources || !sources.length) return;
      const el = document.createElement("div");
      el.className = "sources";
      el.innerHTML = "Sources: " + sources.map(s => `<span>${s}</span>`).join("");
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      if (empty) empty.remove();

      addMessage(question, "user");
      input.value = "";
      send.disabled = true;

      const thinking = addMessage("Thinking", "bot");
      thinking.classList.add("dots");

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        if (!res.ok) throw new Error("Request failed (" + res.status + ")");
        const data = await res.json();
        thinking.classList.remove("dots");
        thinking.textContent = data.answer;
        addSources(data.sources);
      } catch (err) {
        thinking.classList.remove("dots");
        thinking.textContent = "⚠️ " + err.message + ". Is the server running and the index built?";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
