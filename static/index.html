<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document Q&amp;A Assistant</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #ffffff; --ink: #0f172a; --muted: #64748b;
      --user: #2563eb; --bot: #f1f5f9; --accent: #2563eb; --line: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .app {
      width: 100%; max-width: 720px; height: min(90vh, 860px);
      background: var(--panel); border-radius: 16px; overflow: hidden;
      display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    header { padding: 18px 22px; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 17px; color: var(--ink); }
    header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

    /* Add-a-document panel */
    details.adder { border-bottom: 1px solid var(--line); background: #f8fafc; }
    details.adder summary {
      cursor: pointer; padding: 12px 22px; font-size: 13.5px; font-weight: 600;
      color: var(--accent); list-style: none;
    }
    details.adder summary::-webkit-details-marker { display: none; }
    details.adder summary::before { content: "＋ "; }
    details[open].adder summary::before { content: "－ "; }
    .adder-body { padding: 0 22px 16px; }
    .adder-body input, .adder-body textarea {
      width: 100%; padding: 10px 12px; font-size: 13.5px; border: 1px solid var(--line);
      border-radius: 8px; outline: none; font-family: inherit; margin-bottom: 8px;
    }
    .adder-body textarea { min-height: 120px; resize: vertical; }
    .adder-body input:focus, .adder-body textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    .adder-actions { display: flex; align-items: center; gap: 14px; }
    .adder-actions button {
      padding: 9px 16px; font-size: 13.5px; font-weight: 600; color: #fff;
      background: var(--accent); border: none; border-radius: 8px; cursor: pointer;
    }
    .adder-actions button:disabled { opacity: .55; cursor: default; }
    .divider { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; color: var(--muted); font-size: 12px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .upload-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .upload-row input[type=file] { flex: 1; min-width: 180px; font-size: 13px; margin-bottom: 0; padding: 8px; }
    .upload-row button {
      padding: 9px 16px; font-size: 13.5px; font-weight: 600; color: #fff;
      background: var(--accent); border: none; border-radius: 8px; cursor: pointer;
    }
    .upload-row button:disabled { opacity: .55; cursor: default; }
    .adder-footer { margin-top: 14px; }
    .clear-link { font-size: 12.5px; color: var(--muted); cursor: pointer; text-decoration: underline; }

    #messages {
      flex: 1; overflow-y: auto; padding: 22px; display: flex;
      flex-direction: column; gap: 14px; background: #fbfcfe;
    }
    .msg { max-width: 82%; padding: 11px 14px; border-radius: 14px; line-height: 1.5;
           font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
    .bot  { align-self: flex-start; background: var(--bot); color: var(--ink); border-bottom-left-radius: 4px; }
    .note { align-self: center; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0;
            font-size: 13px; padding: 7px 12px; border-radius: 10px; }
    .sources { align-self: flex-start; font-size: 12px; color: var(--muted); margin-top: -6px; }
    .sources span {
      display: inline-block; background: #eef2ff; color: var(--accent);
      border: 1px solid #dbe3ff; padding: 2px 8px; border-radius: 999px; margin-right: 6px;
    }
    .empty { color: var(--muted); font-size: 14px; text-align: center; margin: auto; max-width: 62%; }
    form.ask { display: flex; gap: 10px; padding: 16px; border-top: 1px solid var(--line); background: #fff; }
    form.ask input {
      flex: 1; padding: 12px 14px; font-size: 14.5px; border: 1px solid var(--line);
      border-radius: 10px; outline: none;
    }
    form.ask input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    form.ask button {
      padding: 0 20px; font-size: 14.5px; font-weight: 600; color: #fff;
      background: var(--accent); border: none; border-radius: 10px; cursor: pointer;
    }
    form.ask button:disabled { opacity: .55; cursor: default; }
    .dots::after { content: "…"; animation: blink 1.2s steps(4) infinite; }
    @keyframes blink { 0%{opacity:.2} 50%{opacity:1} 100%{opacity:.2} }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>📄 Document Q&amp;A Assistant</h1>
      <p>Answers are grounded in your indexed documents, with sources cited.</p>
    </header>

    <details class="adder">
      <summary>Add a document (paste a job description, notes, etc.)</summary>
      <div class="adder-body">
        <input id="docName" type="text" placeholder="Name for this document (e.g. Amazon SDE job description)" />
        <textarea id="docText" placeholder="Paste your text here..."></textarea>
        <div class="adder-actions">
          <button id="addBtn" type="button">Add pasted text</button>
        </div>

        <div class="divider"><span>or upload a file</span></div>

        <div class="upload-row">
          <input id="fileInput" type="file" accept=".pdf,.txt,.md" />
          <button id="uploadBtn" type="button">Upload file</button>
        </div>

        <div class="adder-footer">
          <span class="clear-link" id="clearLink">Clear all documents</span>
        </div>
      </div>
    </details>

    <div id="messages">
      <div class="empty" id="empty">Paste a document above, or ask a question about your existing documents.</div>
    </div>

    <form class="ask" id="form">
      <input id="input" type="text" placeholder="e.g. What skills does this job require?" autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const empty = document.getElementById("empty");
    const addBtn = document.getElementById("addBtn");
    const clearLink = document.getElementById("clearLink");
    const docName = document.getElementById("docName");
    const docText = document.getElementById("docText");

    function clearEmpty() { const e = document.getElementById("empty"); if (e) e.remove(); }

    function addMessage(text, cls) {
      const el = document.createElement("div");
      el.className = "msg " + cls;
      el.textContent = text;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }
    function addNote(text) {
      clearEmpty();
      const el = document.createElement("div");
      el.className = "note";
      el.textContent = text;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
    }
    function addSources(sources) {
      if (!sources || !sources.length) return;
      const el = document.createElement("div");
      el.className = "sources";
      el.innerHTML = "Sources: " + sources.map(s => `<span>${s}</span>`).join("");
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
    }

    // Add pasted text to the index
    addBtn.addEventListener("click", async () => {
      const text = docText.value.trim();
      const name = docName.value.trim() || "pasted-text";
      if (!text) { docText.focus(); return; }
      addBtn.disabled = true;
      const original = addBtn.textContent;
      addBtn.textContent = "Adding...";
      try {
        const res = await fetch("/add-text", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, text }),
        });
        if (!res.ok) throw new Error("Add failed (" + res.status + ")");
        const data = await res.json();
        addNote(`✓ Added "${data.source}" (${data.indexed_chunks} chunk(s)). You can now ask about it.`);
        docText.value = "";
        docName.value = "";
      } catch (err) {
        addNote("⚠️ " + err.message + ". Is the server running and your API key/credit set?");
      } finally {
        addBtn.disabled = false;
        addBtn.textContent = original;
      }
    });

    // Upload a file (PDF / TXT / MD)
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    uploadBtn.addEventListener("click", async () => {
      const f = fileInput.files[0];
      if (!f) { fileInput.click(); return; }
      uploadBtn.disabled = true;
      const original = uploadBtn.textContent;
      uploadBtn.textContent = "Uploading...";
      try {
        const fd = new FormData();
        fd.append("file", f);
        const res = await fetch("/upload", { method: "POST", body: fd });
        if (!res.ok) throw new Error("Upload failed (" + res.status + ")");
        const data = await res.json();
        if (!data.indexed_chunks) {
          addNote(`⚠️ Could not read "${data.source}". Use a PDF with selectable text, or a TXT/MD file.`);
        } else {
          addNote(`✓ Uploaded "${data.source}" (${data.indexed_chunks} chunk(s)). You can now ask about it.`);
        }
        fileInput.value = "";
      } catch (err) {
        addNote("⚠️ " + err.message + ". Is the server running and your API key/credit set?");
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = original;
      }
    });

    // Clear the whole index
    clearLink.addEventListener("click", async () => {
      if (!confirm("Remove ALL documents from the knowledge base?")) return;
      try {
        const res = await fetch("/clear", { method: "POST" });
        if (!res.ok) throw new Error("Clear failed (" + res.status + ")");
        addNote("✓ Cleared all documents. Paste something new to begin.");
      } catch (err) {
        addNote("⚠️ " + err.message);
      }
    });

    // Ask a question
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      clearEmpty();
      addMessage(question, "user");
      input.value = "";
      send.disabled = true;

      const thinking = addMessage("Thinking", "bot");
      thinking.classList.add("dots");
      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        if (!res.ok) throw new Error("Request failed (" + res.status + ")");
        const data = await res.json();
        thinking.classList.remove("dots");
        thinking.textContent = data.answer;
        addSources(data.sources);
      } catch (err) {
        thinking.classList.remove("dots");
        thinking.textContent = "⚠️ " + err.message + ". Is the server running and the index built?";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
